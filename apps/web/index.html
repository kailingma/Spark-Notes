<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1"
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#fbfbfa" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#17171a" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Spark — markdown notes with as little friction as possible." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Spark</title>
    <script>
      // Apply the saved theme before first paint so there is never a flash of
      // the wrong background.
      try {
        var t = JSON.parse(localStorage.getItem('spark:app.theme') || '"system"');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
